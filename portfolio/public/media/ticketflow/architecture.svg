<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">TicketFlow architecture</title>
  <desc id="arch-desc">React frontend talks to an Express REST API secured by JWT auth; the API reads and writes a relational PostgreSQL database.</desc>

  <defs>
    <marker id="tf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--color-text-muted, #666)"/>
    </marker>
  </defs>

  <!-- Frontend -->
  <g>
    <rect x="60" y="140" width="220" height="80" rx="12" style="fill:var(--color-surface, #fff); stroke:var(--color-accent, #c2410c)"/>
    <text x="170" y="172" text-anchor="middle" style="fill:var(--color-text-primary, #111); font:600 15px sans-serif">React frontend</text>
    <text x="170" y="194" text-anchor="middle" style="fill:var(--color-text-muted, #666); font:12px sans-serif">reporter / technician / admin views</text>
  </g>

  <!-- API -->
  <g>
    <rect x="400" y="60" width="220" height="80" rx="12" style="fill:var(--color-surface, #fff); stroke:var(--color-border-strong, #999)"/>
    <text x="510" y="92" text-anchor="middle" style="fill:var(--color-text-primary, #111); font:600 15px sans-serif">Express API</text>
    <text x="510" y="114" text-anchor="middle" style="fill:var(--color-text-muted, #666); font:12px sans-serif">REST endpoints + status workflow</text>
  </g>

  <!-- Auth -->
  <g>
    <rect x="400" y="220" width="220" height="70" rx="12" style="fill:var(--color-surface-raised, #eee); stroke:var(--color-border-strong, #999)"/>
    <text x="510" y="248" text-anchor="middle" style="fill:var(--color-text-primary, #111); font:600 15px sans-serif">JWT auth</text>
    <text x="510" y="268" text-anchor="middle" style="fill:var(--color-text-muted, #666); font:12px sans-serif">role-based access control</text>
  </g>

  <!-- Database -->
  <g>
    <rect x="740" y="140" width="180" height="80" rx="12" style="fill:var(--color-surface, #fff); stroke:var(--color-border-strong, #999)"/>
    <text x="830" y="172" text-anchor="middle" style="fill:var(--color-text-primary, #111); font:600 15px sans-serif">PostgreSQL</text>
    <text x="830" y="194" text-anchor="middle" style="fill:var(--color-text-muted, #666); font:12px sans-serif">relational schema</text>
  </g>

  <!-- Arrows -->
  <line x1="280" y1="170" x2="396" y2="110" style="stroke:var(--color-text-muted, #666)" stroke-width="2" marker-end="url(#tf-arrow)"/>
  <text x="300" y="120" style="fill:var(--color-text-muted, #666); font:11px sans-serif">HTTPS / JSON</text>
  <line x1="280" y1="210" x2="396" y2="250" style="stroke:var(--color-text-muted, #666)" stroke-width="2" marker-end="url(#tf-arrow)"/>
  <text x="310" y="245" style="fill:var(--color-text-muted, #666); font:11px sans-serif">Bearer token</text>
  <line x1="620" y1="110" x2="736" y2="160" style="stroke:var(--color-text-muted, #666)" stroke-width="2" marker-end="url(#tf-arrow)"/>
  <line x1="620" y1="250" x2="736" y2="200" style="stroke:var(--color-text-muted, #666)" stroke-width="2" marker-end="url(#tf-arrow)"/>
</svg>
