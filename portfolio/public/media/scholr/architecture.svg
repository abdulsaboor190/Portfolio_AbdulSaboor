<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="sch-title sch-desc">
  <title id="sch-title">Scholr architecture</title>
  <desc id="sch-desc">A React Native mobile app connects to containerized Node.js backend services running in Docker; real-time messaging runs between users.</desc>

  <defs>
    <marker id="sch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--color-text-muted, #666)"/>
    </marker>
  </defs>

  <!-- Mobile app -->
  <g>
    <rect x="60" y="150" width="200" height="100" rx="16" style="fill:var(--color-surface, #fff); stroke:var(--color-accent, #c2410c)"/>
    <rect x="140" y="142" width="40" height="10" rx="5" style="fill:var(--color-border-strong, #999)"/>
    <text x="160" y="185" text-anchor="middle" style="fill:var(--color-text-primary, #111); font:600 15px sans-serif">React Native app</text>
    <text x="160" y="207" text-anchor="middle" style="fill:var(--color-text-muted, #666); font:12px sans-serif">list · browse · request</text>
    <text x="160" y="225" text-anchor="middle" style="fill:var(--color-text-muted, #666); font:12px sans-serif">real-time chat</text>
  </g>

  <!-- Backend services -->
  <g>
    <rect x="400" y="60" width="220" height="80" rx="12" style="fill:var(--color-surface, #fff); stroke:var(--color-border-strong, #999)"/>
    <text x="510" y="92" text-anchor="middle" style="fill:var(--color-text-primary, #111); font:600 15px sans-serif">Node.js services</text>
    <text x="510" y="114" text-anchor="middle" style="fill:var(--color-text-muted, #666); font:12px sans-serif">API + messaging service</text>
  </g>
  <g>
    <rect x="400" y="220" width="220" height="80" rx="12" style="fill:var(--color-surface-raised, #eee); stroke:var(--color-border-strong, #999)"/>
    <text x="510" y="252" text-anchor="middle" style="fill:var(--color-text-primary, #111); font:600 15px sans-serif">Docker</text>
    <text x="510" y="274" text-anchor="middle" style="fill:var(--color-text-muted, #666); font:12px sans-serif">containerized deployment</text>
  </g>

  <!-- Database -->
  <g>
    <rect x="740" y="140" width="180" height="80" rx="12" style="fill:var(--color-surface, #fff); stroke:var(--color-border-strong, #999)"/>
    <text x="830" y="172" text-anchor="middle" style="fill:var(--color-text-primary, #111); font:600 15px sans-serif">Database</text>
    <text x="830" y="194" text-anchor="middle" style="fill:var(--color-text-muted, #666); font:12px sans-serif">listings &amp; messages</text>
  </g>

  <!-- Arrows -->
  <line x1="260" y1="185" x2="396" y2="120" style="stroke:var(--color-text-muted, #666)" stroke-width="2" marker-end="url(#sch-arrow)"/>
  <text x="300" y="130" style="fill:var(--color-text-muted, #666); font:11px sans-serif">REST + realtime</text>
  <line x1="260" y1="215" x2="396" y2="260" style="stroke:var(--color-text-muted, #666)" stroke-width="2" marker-end="url(#sch-arrow)"/>
  <line x1="620" y1="100" x2="736" y2="160" style="stroke:var(--color-text-muted, #666)" stroke-width="2" marker-end="url(#sch-arrow)"/>
  <line x1="620" y1="260" x2="736" y2="200" style="stroke:var(--color-text-muted, #666)" stroke-width="2" marker-end="url(#sch-arrow)"/>
</svg>
